# Gateway CAC — dois listeners (espelha portal × gestor no host)
# Host: portalcac → :8084 · gestorcac → :8086
# Local: http://localhost:8084 (portal+api) · http://localhost:8086 (gestor+api)

# --- Portal público (www) ---
server {
  listen 80 default_server;
  server_name portalcac.netsys.company localhost 127.0.0.1 _;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://cac-api:3003/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://cac-api:3003/health;
  }

  location /ready {
    proxy_pass http://cac-api:3003/ready;
  }

  location /uploads/ {
    proxy_pass http://cac-api:3003/uploads/;
  }

  location / {
    proxy_pass http://cac-www:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Painel / gestor (web) ---
server {
  listen 81;
  server_name gestorcac.netsys.company;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://cac-api:3003/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://cac-api:3003/health;
  }

  location /ready {
    proxy_pass http://cac-api:3003/ready;
  }

  location /uploads/ {
    proxy_pass http://cac-api:3003/uploads/;
  }

  location / {
    proxy_pass http://cac-web:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
