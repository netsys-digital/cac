# Gateway CAC — dois listeners (espelha portal × gestor no host)
# Host: portalcac → :8084 · gestorcac → :8086
# Local: http://localhost:8084 (portal+api) · http://localhost:8086 (gestor+api)
#
# Variáveis + resolver Docker: nginx sobe mesmo se cac-api estiver reiniciando.

# --- Portal público (www) ---
server {
  listen 80 default_server;
  server_name portalcac.netsys.company localhost 127.0.0.1 _;
  client_max_body_size 25m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/health;
  }

  location /ready {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/ready;
  }

  location /uploads/ {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/uploads/;
  }

  location / {
    set $cac_www cac-www:80;
    proxy_pass http://$cac_www/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Painel / gestor (web) ---
server {
  listen 81;
  server_name gestorcac.netsys.company;
  client_max_body_size 25m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/health;
  }

  location /ready {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/ready;
  }

  location /uploads/ {
    set $cac_api cac-api:3003;
    proxy_pass http://$cac_api/uploads/;
  }

  location / {
    set $cac_web cac-web:80;
    proxy_pass http://$cac_web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
