# Produção — CAC na rede netsys (Postgres/Redis compartilhados).
# Path canônico no servidor: /app/cac
# Pré-requisito: docker-config (/app/docker-config) + volume cac_uploads_data.
#
# Instalação do zero:
#   bash scripts/install-prod.sh
# Deploy incremental:
#   bash deploy.sh [--full]

name: cac

networks:
  netsys:
    external: true
    name: netsys

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Entrypoint: migrate deploy + seed non-blocking + node.
    # Antes do recreate da api, deploy.sh roda scripts/prod-db-prepare.sh
    # (DDL como netsys + OWNER → cac) para evitar P3009/42501.
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql://cac:${CAC_DB_PASSWORD:?CAC_DB_PASSWORD required in .env.prod}@postgres:5432/cac
      REDIS_URL: redis://redis:6379/5
      API_PORT: '3003'
      NODE_ENV: production
      OFFLINE_MODE: ${OFFLINE_MODE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://portalcac.netsys.company,https://gestorcac.netsys.company}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.netsys.company}
    volumes:
      - uploads_data:/app/apps/api/uploads
    networks:
      netsys:
        aliases:
          - cac-api
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3003/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker.js
    working_dir: /app/apps/api
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DATABASE_URL: postgresql://cac:${CAC_DB_PASSWORD:?CAC_DB_PASSWORD required in .env.prod}@postgres:5432/cac
      REDIS_URL: redis://redis:6379/5
      NODE_ENV: production
      OFFLINE_MODE: ${OFFLINE_MODE:-true}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - netsys
    restart: unless-stopped

  www:
    build:
      context: .
      dockerfile: apps/www/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
        VITE_WEB_URL: ${PUBLIC_WEB_URL:-https://gestorcac.netsys.company}
        VITE_WWW_URL: ${PUBLIC_WWW_URL:-https://portalcac.netsys.company}
        VITE_APP_BRAND_NAME: ${APP_BRAND_NAME:-AgriZone Connect}
        VITE_APP_BRAND_SHORT: ${APP_BRAND_SHORT:-AZC}
        VITE_APP_BRAND_LOGO: ${APP_BRAND_LOGO:-}
        VITE_FONT_EXTRA_GRANDE: ${VITE_FONT_EXTRA_GRANDE:-54px}
        VITE_FONT_GRANDE: ${VITE_FONT_GRANDE:-32px}
        VITE_FONT_MEDIA: ${VITE_FONT_MEDIA:-18px}
        VITE_FONT_PEQUENA: ${VITE_FONT_PEQUENA:-14px}
        VITE_FONT_MINI: ${VITE_FONT_MINI:-13px}
    depends_on:
      api:
        condition: service_healthy
    networks:
      netsys:
        aliases:
          - cac-www
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
        VITE_WEB_URL: ${PUBLIC_WEB_URL:-https://gestorcac.netsys.company}
        VITE_WWW_URL: ${PUBLIC_WWW_URL:-https://portalcac.netsys.company}
        VITE_BASE: /
        VITE_APP_BRAND_NAME: ${APP_BRAND_NAME:-AgriZone Connect}
        VITE_APP_BRAND_SHORT: ${APP_BRAND_SHORT:-AZC}
        VITE_APP_BRAND_LOGO: ${APP_BRAND_LOGO:-}
        VITE_FONT_EXTRA_GRANDE: ${VITE_FONT_EXTRA_GRANDE:-54px}
        VITE_FONT_GRANDE: ${VITE_FONT_GRANDE:-32px}
        VITE_FONT_MEDIA: ${VITE_FONT_MEDIA:-18px}
        VITE_FONT_PEQUENA: ${VITE_FONT_PEQUENA:-14px}
        VITE_FONT_MINI: ${VITE_FONT_MINI:-13px}
    depends_on:
      api:
        condition: service_healthy
    networks:
      netsys:
        aliases:
          - cac-web
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - '${GATEWAY_PORT_PORTAL:-8084}:80'
      - '${GATEWAY_PORT_GESTOR:-8086}:81'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - www
      - web
      - api
    networks:
      - netsys
    restart: unless-stopped

volumes:
  uploads_data:
    external: true
    name: cac_uploads_data
