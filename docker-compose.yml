# Rede explícita para DNS entre api/worker e LibreTranslate.
# netsys (externa) cobre o caso híbrido local+gateway de prod no mesmo host.
networks:
  default:
    name: cac_default
  netsys:
    external: true
    name: netsys

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cac
      POSTGRES_PASSWORD: cac_secret
      POSTGRES_DB: cac
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cac -d cac']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    build:
      context: ./deploy/libretranslate
    image: cac-libretranslate:v1.9.6-ptenes
    command: --load-only en,es,pt
    environment:
      LT_DISABLE_WEB_UI: 'true'
      LT_UPDATE_MODELS: 'false'
      LT_LOAD_ONLY: en,es,pt
      LT_THREADS: '2'
    ports:
      - '5001:5000'
    networks:
      default:
        aliases:
          - libretranslate
      netsys:
        aliases:
          - libretranslate
          - cac-libretranslate
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5000/languages'')"',
        ]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 240s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "npx prisma migrate deploy && (npx prisma db seed || echo '[cac-api] seed failed — continuing') && node dist/index.js"
    working_dir: /app/apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cac:cac_secret@postgres:5432/cac
      REDIS_URL: redis://redis:6379
      API_PORT: '3003'
      COOKIE_DOMAIN: localhost
      CORS_ORIGIN: http://localhost:5178,http://localhost:5179
      LIBRETRANSLATE_URL: http://libretranslate:5000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3003:3003'
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node dist/worker.js
    working_dir: /app/apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cac:cac_secret@postgres:5432/cac
      REDIS_URL: redis://redis:6379
      LIBRETRANSLATE_URL: http://libretranslate:5000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  www:
    build:
      context: .
      dockerfile: apps/www/Dockerfile
      args:
        VITE_API_URL: http://localhost:3003
        VITE_WEB_URL: http://localhost:5178
        VITE_WWW_URL: http://localhost:5179
        VITE_APP_BRAND_NAME: AgriZONE Connect
        VITE_APP_BRAND_SHORT: AZC
        VITE_APP_BRAND_LOGO: ""
        VITE_FONT_EXTRA_GRANDE: 54px
        VITE_FONT_GRANDE: 32px
        VITE_FONT_MEDIA: 18px
        VITE_FONT_PEQUENA: 14px
        VITE_FONT_MINI: 13px
    ports:
      - '5179:80'
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3003
        VITE_WEB_URL: http://localhost:5178
        VITE_WWW_URL: http://localhost:5179
        VITE_APP_BRAND_NAME: AgriZONE Connect
        VITE_APP_BRAND_SHORT: AZC
        VITE_APP_BRAND_LOGO: ""
        VITE_FONT_EXTRA_GRANDE: 54px
        VITE_FONT_GRANDE: 32px
        VITE_FONT_MEDIA: 18px
        VITE_FONT_PEQUENA: 14px
        VITE_FONT_MINI: 13px
    ports:
      - '5178:80'
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
